name: Feature Request
description: Suggest an addition or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Describe it below. Focus on the problem you're trying to solve rather than a specific implementation.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and what's getting in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any workarounds you're currently using, or other approaches you thought of.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, examples from other apps, additional context.